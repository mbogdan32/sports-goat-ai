<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050706">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GOAT ai">
<title>Sports GOAT ai</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,800;0,900;1,800;1,900&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#050706;--card:#0D130F;--card2:#152019;--line:#1F3024;--line2:#19261D;--nav:#080C09;
  --ink:#F3F6F4;--ink2:#C9D3CD;--mute:#9DAAA2;--green:#3BEA4E;--greenbg:#0F2A15;--white:#FFFFFF;
  --display:'Exo 2',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--ink2)}a:hover{color:var(--white)}
button{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--white)}
.brand img{width:52px;height:42px;object-fit:contain}
.brand .w1{font:italic 800 11px/1 var(--display);letter-spacing:3px;color:var(--ink2)}
.brand .w2{font:900 25px/1 var(--display);letter-spacing:.5px}
.brand .w2 span{color:var(--green)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--mute);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}
.dot.old{background:#6B776F}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--nav);border-top:1px solid #1C2A20;display:flex;justify-content:space-around;padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:64px;min-height:48px;text-decoration:none;color:var(--mute);font-size:11px;font-weight:600}
nav.tabs a[aria-current="page"]{color:var(--green)}
nav.tabs svg{width:22px;height:22px}
@media (min-width:900px){
  nav.tabs{position:static;background:none;border:0;padding:0;gap:4px;justify-content:flex-end}
  nav.tabs a{flex-direction:row;min-height:40px;padding:0 14px;border-radius:10px;font-size:14px}
  nav.tabs a[aria-current="page"]{background:var(--card);color:var(--green)}
  nav.tabs svg{width:18px;height:18px}
  .wrap{padding-bottom:48px}
  header.top{padding-bottom:16px}
}
.headrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.headrow .grow{flex:1}
h1{margin:0;font:italic 900 34px/1.05 var(--display);text-transform:uppercase}
h2{margin:0;font:italic 900 22px/1.1 var(--display);text-transform:uppercase}
.sub{font-size:13px;color:var(--mute)}
section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:700px){.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1000px){.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.two.wide3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
a.card{text-decoration:none;color:var(--ink)}
a.card:hover{border-color:#2E4A35;color:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top-align{align-items:flex-start}
.name{font-size:16px;font-weight:600}
.meta{font-size:12px;color:var(--mute)}
.big{font:italic 900 26px/1 var(--display)}
.big.g{color:var(--green)}
.tag{font-size:11px;font-weight:700;letter-spacing:.6px;padding:4px 8px;border-radius:6px;background:var(--card2);color:var(--ink2);white-space:nowrap}
.tag.g{background:var(--greenbg);color:var(--green)}
.tag.w{background:#2B2F2D;color:var(--white)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;padding:4px 8px;border-radius:6px;background:var(--card2);color:var(--ink2)}
.bar{height:6px;border-radius:3px;background:#1F3024;overflow:hidden}
.bar>div{height:100%;background:var(--green)}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#1F3024}
.split .a{background:var(--ink2)}.split .h{flex:1;background:var(--green)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{flex-shrink:0;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-weight:600;font-size:13px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#050706}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--ink2);font-weight:600;font-size:13px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--green);color:#050706}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats4 .k{font-size:11px;color:var(--mute)}
.stats4 .v{font:italic 900 21px/1.1 var(--display)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list>.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.list>.li:last-child{border-bottom:0}
a.li{text-decoration:none;color:var(--ink)}
a.li:hover{background:#101912}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--mute);font-size:14px;text-align:center}
.warn{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:#141A16;border:1px solid #2B3A2F;color:var(--ink2);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;font-weight:600;color:var(--mute);text-align:left;padding:8px 10px;background:var(--card2)}
td{padding:9px 10px;border-top:1px solid var(--line2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:520px){.hide-m{display:none}}
tr.hit td{background:#0F2015}
.tbl{border:1px solid var(--line);border-radius:10px;overflow:auto}
.more{align-self:center;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-weight:600;cursor:pointer}
.note{font-size:12px;color:var(--mute);line-height:1.5}
.rate{display:inline-flex;align-items:baseline;gap:1px;font:italic 900 28px/1 var(--display);color:var(--ink)}
.rate small{font:600 11px Inter,sans-serif;color:var(--mute);font-style:normal}
.rate.hi{color:var(--green)}.rate.mid{color:var(--white)}.rate.lo{color:#7F8C84}
.rpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--card2);color:var(--ink2);white-space:nowrap}
.rpill.hi{background:var(--greenbg);color:var(--green)}
.cvn{display:flex;align-items:flex-end;gap:12px;padding:10px 12px;border-radius:10px;background:var(--card2)}
.cvn .k{font-size:11px;color:var(--mute)}.cvn .v{font:italic 900 24px/1.1 var(--display)}.cvn .v.mute{color:var(--ink2)}.cvn .vs{font-size:12px;color:var(--mute);padding-bottom:4px}.cvn .grow{flex:1}
.explain{font-size:13px;line-height:1.5;color:var(--ink2);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0A100C}
.explain .tag{font-size:10px;padding:2px 6px}
.ocard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ocard.val{border-color:#2A6A34;background:linear-gradient(0deg,#0D130F,#0D130F)}
.ocard .rank{width:26px;height:26px;border-radius:7px;background:var(--card2);color:var(--mute);display:flex;align-items:center;justify-content:center;font:900 15px var(--display);flex-shrink:0}
.ocard .bar{position:relative;overflow:visible}
.ocard .bar>div{border-radius:3px}
.ocard .bar i{position:absolute;top:-3px;width:2px;height:11px;background:var(--white);border-radius:1px}
.ostats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:420px){.ostats b{font-size:14px}.ostats em{font-size:10px}}
.ostats div{display:flex;flex-direction:column;gap:1px;min-width:0}
.ostats span{font-size:11px;color:var(--mute)}
.ostats b{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap}
.ostats em{font-style:normal;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tier{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:900 18px var(--display);color:#050706;flex-shrink:0;background:var(--green)}
.tier.B{background:var(--ink2)}.tier.C{background:#6B776F}
.goalie-st{font-size:10px;font-weight:700;letter-spacing:.6px;padding:3px 6px;border-radius:5px;background:#2B2F2D;color:var(--ink2);text-transform:uppercase}
.goalie-st.ok{background:var(--greenbg);color:var(--green)}
footer{margin-top:32px;font-size:12px;color:var(--mute);line-height:1.6}
.loading{padding:60px 0;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#today" aria-label="Sports GOAT ai home">
      <img src="logo.jpg" alt="">
      <div><div class="w1">SPORTS</div><div class="w2">GOAT<span>ai</span></div></div>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#today" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Today</a>
      <a href="#goals" data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="1"/><path d="M3 12h18M9 6v12M15 6v12"/></svg>Goals</a>
      <a href="#shots" data-tab="shots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>Shots</a>
      <a href="#games" data-tab="games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Games</a>
      <a href="#record" data-tab="record"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-7M2 20h20"/></svg>Record</a>
    </nav>
  </header>
  <main id="app"><div class="loading">Loading tonight's picks…</div></main>
  <footer id="foot"></footer>
</div>
<script>
(function(){
"use strict";
var D=null, ui={goalGame:"All", goalShow:30, shotTab:"Best", boardCat:"2+ shots", shotShow:30, game:0};
try{var s=JSON.parse(localStorage.getItem("goat_ui")||"{}");if(s.shotTab)ui.shotTab=s.shotTab;if(s.boardCat)ui.boardCat=s.boardCat;}catch(e){}
function save(){try{localStorage.setItem("goat_ui",JSON.stringify({shotTab:ui.shotTab,boardCat:ui.boardCat}));}catch(e){}}

function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pct(p,d){return p==null?"—":(p*100).toFixed(d==null?0:d)+"%";}
function pts(e){return e==null?"—":(e>=0?"+":"")+(e*100).toFixed(1);}
function rcls(r){return r==null?"lo":r>=75?"hi":r>=50?"mid":"lo";}
function rate(r,size){return r==null?'<span class="rate lo">—</span>':'<span class="rate '+rcls(r)+'"'+(size?' style="font-size:'+size+'px"':"")+'>'+r+'<small>/100</small></span>';}
function rpill(r){return r==null?"":'<span class="rpill '+(r>=75?"hi":"")+'">Rating '+r+'</span>';}
function byR(a,b){return (b.rating==null?-1:b.rating)-(a.rating==null?-1:a.rating);}
function units(u){return (u>=0?"+":"")+u.toFixed(2)+"u";}
function wl(r){return r?r.w+"–"+r.l:"—";}
function dayLabel(iso,long){if(!iso)return"";var d=new Date(iso+"T12:00:00");return d.toLocaleDateString(undefined,long?{weekday:"long",month:"short",day:"numeric"}:{month:"short",day:"numeric"});}
function timeLabel(iso){if(!iso)return"";var d=new Date(iso);return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}
function ago(iso){if(!iso)return Infinity;return (Date.now()-new Date(iso).getTime())/3600000;}

function staleNote(){
  var out=[], t=D.today;
  [["Goal scorer model",D.goals],["Shots model",D.sog],["Game model",D.games]].forEach(function(m){
    if(!m[1].date) out.push(m[0]+" has no report yet.");
    else if(m[1].date!==t) out.push(m[0]+" last ran "+dayLabel(m[1].date)+".");
  });
  return out.length?'<div class="warn"><span class="dot old" style="margin-top:5px"></span><span>'+esc(out.join(" "))+'</span></div>':"";
}

function nextUpdate(){
  var s=D.schedule||[]; if(!s.length) return null;
  var now=new Date(), mins=now.getHours()*60+now.getMinutes();
  function toMin(t){var m=/(\d+):(\d+)\s*(AM|PM)/i.exec(t);if(!m)return 0;var h=+m[1]%12;if(/PM/i.test(m[3]))h+=12;return h*60+(+m[2]);}
  for(var i=0;i<s.length;i++){if(toMin(s[i].time)>mins)return s[i];}
  return {time:s[0].time,what:s[0].what+" (tomorrow)"};
}

/* ------------------------------------------------ TODAY */
function bestPlays(){
  var list=[];
  (D.games.plays||[]).forEach(function(p){list.push({model:"GAME · TIER "+p.tier,when:p.game,title:p.bet+" "+p.price,detail:"Ours "+pct(p.model_p,1)+" · needs "+pct(p.breakeven,1),edge:p.edge,rating:p.rating,href:"#games",w:p.tier==="A"?3:p.tier==="B"?2:1});});
  (D.sog.plays||[]).filter(function(p){return p.tier==="Bet";}).sort(byR).slice(0,6).forEach(function(p){list.push({model:"SHOTS · BET",when:p.team+" vs "+p.opp,title:p.player+" · "+p.bet,detail:"Chance "+pct(p.chance,1)+" vs need "+pct(p.need,1)+" · "+(p.side==="Under"?"U ":"O ")+p.line+" "+p.price+" "+p.book,edge:p.edge,rating:p.rating,href:"#shots",w:2});});
  (D.goals.date===D.today?(D.goals.picks||[]):[]).filter(function(p){return p.best&&p.rating!=null&&p.rating>=60;}).sort(byR).slice(0,3).forEach(function(p){list.push({model:"GOAL SCORER · VALUE",when:p.matchup,title:p.player+" to score "+p.best,detail:"Ours "+pct(p.prob)+" · fair "+p.fair+(p.book?" · "+p.book:""),edge:p.edge,rating:p.rating,href:"#goals",w:2});});
  list.sort(byR);
  return list.slice(0,6);
}
function viewToday(){
  var g=D.games.games||[], h="";
  var head=dayLabel(D.today,true)+" · "+g.length+" game"+(g.length===1?"":"s");
  h+='<section style="margin-top:6px"><div class="sub">'+esc(head)+'</div><h1>Tonight\'s best plays</h1><div class="sub">Highest-rated plays across all three models</div>'+staleNote()+'</section>';
  var bp=bestPlays();
  h+='<section><div class="grid two wide3">';
  if(!bp.length) h+='<div class="empty">No rated plays yet. Check back after the next update.</div>';
  bp.forEach(function(p){
    h+='<a class="card" href="'+p.href+'"><div class="row"><span class="tag">'+esc(p.model)+'</span><span class="meta">'+esc(p.when)+'</span></div>'+
      '<div class="row" style="align-items:flex-end"><div style="min-width:0"><div class="name">'+esc(p.title)+'</div><div class="meta" style="font-size:13px">'+esc(p.detail)+'</div></div>'+
      '<div style="text-align:right;flex-shrink:0">'+rate(p.rating)+'<div class="meta">edge '+pts(p.edge)+'</div></div></div></a>';
  });
  h+='</div></section>';

  var tv=(D.sog.date===D.today?(D.sog.top||[]):[]).filter(function(o){return o.value;});
  if(tv.length){
    h+='<section><div class="secthead"><h2>70%+ shots plays with value</h2><a href="#shots" data-shottab-link="Best" class="sub">Best bets</a></div><div class="list">';
    tv.slice(0,6).forEach(function(o){h+='<a class="li" href="#shots" data-shottab-link="Best"><div style="flex:1;min-width:0"><div style="font-weight:600">'+esc(o.player)+' · '+esc(o.bet)+'</div><div class="meta">'+esc((o.side==="Under"?"U ":"O ")+o.line+" "+o.price+" "+o.book+" · "+o.team+" vs "+o.opp)+'</div></div><div style="text-align:right"><div style="font-weight:700">'+pct(o.chance)+'</div><div class="meta">needs '+pct(o.need)+'</div></div></a>';});
    h+='</div></section>';
  }
  var gp=(D.goals.picks||[]).slice(0);
  if(gp.length){
    var seen={}, tops=[];
    gp.forEach(function(p){if(!seen[p.matchup]&&tops.length<6){seen[p.matchup]=1;tops.push(p);}});
    h+='<section><div class="secthead"><h2>Top goal scorer per game</h2><a href="#goals" class="sub">All picks</a></div><div class="list">';
    tops.forEach(function(p){h+='<a class="li" href="#goals"><div style="flex:1;min-width:0"><div style="font-weight:600">'+esc(p.player)+'</div><div class="meta">'+esc(p.team+" · "+p.line+(p.pp&&p.pp!=="none"?" · "+p.pp:"")+" · "+p.matchup)+'</div></div><div style="text-align:right"><div style="font-weight:700">'+pct(p.prob)+'</div><div class="meta">fair '+esc(p.fair)+'</div></div></a>';});
    h+='</div></section>';
  }

  h+='<section><div class="secthead"><h2>Slate</h2><a href="#games" class="sub">All games</a></div><div class="list">';
  if(!g.length) h+='<div class="li meta">No games yet.</div>';
  g.forEach(function(x,i){
    h+='<a class="li" href="#games" data-game="'+i+'"><div style="width:58px" class="meta">'+esc(x.start)+'</div><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div class="row" style="font-size:14px;font-weight:600"><span>'+esc(x.away)+' '+pct(x.p_away)+'</span><span>'+pct(x.p_home)+' '+esc(x.home)+'</span></div><div class="split"><div class="a" style="width:'+((x.p_away||0)*100)+'%"></div><div class="h"></div></div></div><div style="width:58px;text-align:right" class="meta">Proj '+(x.proj_total==null?"—":x.proj_total.toFixed(1))+'</div></a>';
  });
  h+='</div></section>';

  var nu=nextUpdate(), lr=D.games.record&&D.games.record.last_day_record, sv2=(D.sog.record||[]).filter(function(r){return D.sog.version&&r.label===D.sog.version+" Bets";})[0];
  h+='<section><div class="grid three">';
  h+='<div class="card"><div class="meta">Game model, last graded night</div><div class="big">'+wl(lr)+'</div><div class="meta">'+(lr?units(lr.units)+" · "+dayLabel(D.games.record.last_day):"No graded plays yet")+'</div></div>';
  if(sv2) h+='<div class="card"><div class="meta">Shots model '+esc(D.sog.version)+' bets, all time</div><div class="big">'+sv2.w+'–'+sv2.l+'</div><div class="meta" style="color:'+(sv2.units>=0?"var(--green)":"var(--ink2)")+'">'+units(sv2.units)+' · ROI '+sv2.roi+'%</div></div>';
  if(nu) h+='<div class="card"><div class="meta">Next update</div><div class="big">'+esc(nu.time)+'</div><div class="meta">'+esc(nu.what)+'</div></div>';
  h+='</div></section>';
  return h;
}

/* ------------------------------------------------ GOALS */
function viewGoals(){
  var all=D.goals.picks||[], h="";
  var games=["All"]; all.forEach(function(p){if(games.indexOf(p.matchup)<0)games.push(p.matchup);});
  if(games.indexOf(ui.goalGame)<0) ui.goalGame="All";

function betPill(o){
  var under=/fewer/.test(o.bet)||o.side==="Under";

}
function lineTxt(o){return (o.side==="Under"?"Under ":"Over ")+esc(o.line);}
function chanceVsNeed(o){
  return '<div class="cvn"><div><div class="k">Chance</div><div class="v">'+pct(o.chance,1)+'</div></div><div class="vs">vs</div><div><div class="k">Need</div><div class="v mute">'+(o.need==null?"—":pct(o.need,1))+'</div></div><div class="grow"></div><div style="text-align:right"><div class="k">Rating</div>'+rate(o.rating,24)+'</div></div>';
}
function splitTxt(o){
  var parts=[];
  if(o.model_only!=null) parts.push("Model "+pct(o.model_only));
  if(o.market!=null) parts.push("Market "+pct(o.market));
  return parts.length?'<div class="note">'+parts.join(" · ")+' (chance blends them 70/30)</div>':"";
}
function shotCard(r,rank){

  if(r.edge!=null) chips.push("Edge "+pts(r.edge)+" pts");

    chanceVsNeed(r)+splitTxt(r)+

}

  add("Shots",D.sog.plays);add("Goals",D.goals.picks);(D.games.games||[]).forEach(function(g){add("Games",g.markets);});
  var stand=["Shots","Goals","Games"].filter(function(l){return src["edge|"+l]&&!src["model|"+l];});
  return '<p>Rating = how good the bet is, 0 to 100. 75+ is a strong play.'+(stand.length?' For now the '+esc(stand.join(", ").toLowerCase())+' rating'+(stand.length>1?"s are":" is")+' worked out from edge until that model supplies its own.':"")+'</p>';
}
var views={today:viewToday,goals:viewGoals,shots:viewShots,games:viewGames,record:viewRecord};
function tab(){var t=(location.hash||"#today").slice(1);return views[t]?t:"today";}
function render(keepScroll){
  if(!D) return;
  var t=tab(), y=window.scrollY;
  document.querySelectorAll("nav.tabs a").forEach(function(a){if(a.dataset.tab===t)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  document.getElementById("app").innerHTML=views[t]();
  var fresh=ago(D.generated_at)<6;
  document.getElementById("foot").innerHTML='<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="pill"><span class="dot'+(fresh?"":" old")+'"></span>Updated '+esc(dayLabel(D.generated_at.slice(0,10))+", "+timeLabel(D.generated_at))+'</span><span>Updates itself after every model run.</span></div>'+ratingNote()+'<p>Model probabilities, not guarantees. Bet responsibly. 21+. Problem gambling help: 1-800-GAMBLER.</p>';
  if(keepScroll) window.scrollTo(0,y);
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-goalgame],[data-goalmore],[data-shottab],[data-boardcat],[data-shotside],[data-shottier],[data-shotmore],[data-game]");
  var lk=e.target.closest("[data-shottab-link]");if(lk){ui.shotTab=lk.dataset.shottabLink;save();}
  if(!b) return;
  if(b.dataset.goalgame!=null){ui.goalGame=b.dataset.goalgame;ui.goalShow=30;}
  else if(b.dataset.goalmore){ui.goalShow+=30;}
  else if(b.dataset.shottab){ui.shotTab=b.dataset.shottab;ui.shotShow=30;save();}
  else if(b.dataset.boardcat){ui.boardCat=b.dataset.boardcat;save();}
  else if(b.dataset.shotside){ui.shotSide=b.dataset.shotside;ui.shotShow=30;}
  else if(b.dataset.shottier){ui.shotTier=b.dataset.shottier;ui.shotShow=30;}
  else if(b.dataset.shotmore){ui.shotShow+=30;}
  else if(b.dataset.game!=null){ui.game=+b.dataset.game;if(b.tagName==="A")return;}
  render(true);
});
window.addEventListener("hashchange",function(){render(false);window.scrollTo(0,0);});

function load(){
  fetch("data/latest.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
  .then(function(d){var changed=!D||d.generated_at!==D.generated_at;D=d;if(changed)render(true);})
  .catch(function(){
    if(window.GOAT_DATA&&!D){D=window.GOAT_DATA;render(false);return;}
    if(!D){var s=document.createElement("script");s.src="data/latest.js";s.onload=function(){if(window.GOAT_DATA){D=window.GOAT_DATA;render(false);}};s.onerror=function(){document.getElementById("app").innerHTML='<div class="empty">Couldn\'t load the picks. Check your connection and pull to refresh.</div>';};document.head.appendChild(s);}
  });
}
load();
setInterval(load,5*60*1000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)load();});
})();
</script>
